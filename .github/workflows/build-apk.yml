
name: Build Kasir Rumah Kopi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP source code tidak ditemukan"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d extracted

      - name: Fix Kotlin source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path("extracted/KasirRumahKopi/app/src/main/java/com/rumahkopi/kasir/MainActivity.kt")
          text = src.read_text()

          imp = "import androidx.compose.foundation.verticalScroll"
          if imp not in text:
              text = text.replace(
                  "import androidx.compose.foundation.rememberScrollState",
                  "import androidx.compose.foundation.rememberScrollState\n" + imp
              )

          text = text.replace(
              "var edit by remember{name}",
              "var edit by remember { mutableStateOf(name) }"
          )

          src.write_text(text)
          print("Source fixes applied")
          PY

      - name: Build APK
        working-directory: extracted/KasirRumahKopi
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kasir-Rumah-Kopi-APK
          path: extracted/KasirRumahKopi/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
